[project]
name = "isaac-l2f"
version = "0.1.0"
description = "L2F-faithful quadrotor dynamics and RAPTOR-contract environments for Isaac Lab 3.0 on Newton"
readme = "README.md"
authors = [
    { name = "ruhalis", email = "arlan.baikurazov@gmail.com" }
]
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
keywords = [
    "isaac-lab",
    "isaac-sim",
    "quadrotor",
    "drone",
    "reinforcement-learning",
    "sim-to-real",
    "l2f",
    "raptor",
    "newton",
    "robotics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.0",
    "torch>=2.11",
]

[project.optional-dependencies]
# Isaac Lab 3.0 ships as one distribution on NVIDIA's index (Linux/Windows only, Newton included).
# Kit-less Newton path (primary): physics, Warp renderer and visualizers all come from Newton, so the
# `ov` extra (kit-less PhysX, RTX and stage packages) is not installed.
isaac = ["isaaclab[rsl-rl]==3.0.0rc1; sys_platform == 'linux'"]
# Kit path: full Isaac Sim 6.1, used only for RTX rendering of recorded flights (scripts/render_flight.py)
# and USD/GUI workflows; physics stays Newton. Mutually exclusive with `isaac`: Isaac Sim pins its own
# torch (2.11.0) and numpy (2.3.1), while the kit-less split takes the latest.
isaacsim = ["isaaclab[rsl-rl,isaacsim]==3.0.0rc1; sys_platform == 'linux'"]
onnx = ["onnxruntime>=1.20"]
raptor = [
    "foundation-policy>=1.0.2",
    "h5py>=3.10",
]

[project.urls]
Repository = "https://github.com/ruhalis/Isaac-L2F"
Issues = "https://github.com/ruhalis/Isaac-L2F/issues"
Releases = "https://github.com/ruhalis/Isaac-L2F/releases"

[project.entry-points."isaaclab.tasks"]
isaac_l2f = "isaac_l2f.tasks"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "foundation-policy>=1.0.2",
    "h5py>=3.10",
    "l2f==2.0.18",
    "onnx>=1.16",
    "onnxruntime>=1.20",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
conflicts = [[{ extra = "isaac" }, { extra = "isaacsim" }]]

# Not explicit: Isaac Sim pins NVIDIA-built transitive packages (e.g. opencv-python-headless-noffmpeg
# 4.14.0.94rc1) that exist only here, and a tool.uv.sources pin cannot reach transitive deps.
# Together with index-strategy = "unsafe-best-match" this is NVIDIA's documented --extra-index-url setup.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
isaaclab = { index = "nvidia" }
